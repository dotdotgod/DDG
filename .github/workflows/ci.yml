name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: runner.os == 'macOS'
        run: scripts/release/setup-macos.sh
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/setup-windows.ps1
      - run: rustup update stable --no-self-update
      - run: rustup component add clippy --toolchain stable
      - run: cargo +stable test --locked --workspace
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Check OpenRPC schemas
        run: cargo +stable test --locked -p ddg-agents-proto openrpc_schemas_are_valid_and_up_to_date
      - name: Smoke test native version (including release-only shaders)
        run: cargo +stable run --locked --release -p ddg-agents-native -- --version

  linux:
    name: linux-x86_64 (Bookworm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build Ghostty VT on Bookworm
        run: |
          docker buildx build --platform linux/amd64 --target vt-builder --load -t ddg-ci-vt -f docker/Dockerfile .
          container=$(docker create ddg-ci-vt)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/ghostty-vt"
          docker cp "$container:/out/lib/libghostty-vt.a" "$RUNNER_TEMP/ghostty-vt/libghostty-vt.a"
      - name: Workspace tests, Clippy, OpenRPC and native version on Bookworm
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP/ghostty-vt:/vt:ro" -w /work \
            -e GHOSTTY_VT_LIB_DIR=/vt -e CARGO_TERM_COLOR \
            rust:1-bookworm bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends clang cmake pkg-config libfontconfig1-dev \
                libwayland-dev libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              rustup component add clippy
              cargo test --locked --workspace
              cargo clippy --locked --workspace --all-targets -- -D warnings
              cargo test --locked -p ddg-agents-proto openrpc_schemas_are_valid_and_up_to_date
              cargo run --locked -p ddg-agents-native -- --version
            '
