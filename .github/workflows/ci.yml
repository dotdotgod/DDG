name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: runner.os == 'macOS'
        run: scripts/release/setup-macos.sh
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/setup-windows.ps1
      - run: rustup update stable --no-self-update
      - run: rustup component add clippy --toolchain stable
      - run: cargo +stable test --locked --workspace --no-fail-fast
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Check OpenRPC schemas
        run: cargo +stable test --locked --no-fail-fast -p ddg-agents-proto openrpc_schemas_are_valid_and_up_to_date
      - name: Smoke test native version (including release-only shaders)
        run: cargo +stable run --locked --release -p ddg-agents-native -- --version

  macos-x86_64-cross:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/release/setup-macos.sh --target-arch x86_64
      - run: rustup update stable --no-self-update
      - run: rustup target add x86_64-apple-darwin --toolchain stable
      - run: rustup component add clippy --toolchain stable
      - run: cargo +stable clippy --locked --workspace --lib --bins --target x86_64-apple-darwin -- -D warnings
      - run: cargo +stable build --locked --release --bins --target x86_64-apple-darwin
      - name: Verify and package thin Intel binaries
        run: |
          bin_dir=target/x86_64-apple-darwin/release
          for name in ddg ddg-agents-host ddg-terminal-server ddg-agents-native; do
            bin="$bin_dir/$name"
            file "$bin"
            [[ $(lipo -archs "$bin") == x86_64 ]]
            deps=$(otool -L "$bin")
            printf '%s\n' "$deps"
            if grep -Eq '^[[:space:]].*/(opt/homebrew|usr/local)/' <<< "$deps"; then exit 1; fi
            otool -l "$bin" | grep -A 3 LC_BUILD_VERSION
          done
          scripts/release/package-macos.sh --platform darwin-x86_64 --bin-dir "$bin_dir" --version 0.0.0-ci --out-dir "$RUNNER_TEMP/dist" --unsigned-dry-run
          test -f "$RUNNER_TEMP/dist/ddg-agents-0.0.0-ci-darwin-x86_64.app.zip"

  linux:
    name: linux-x86_64 (Bookworm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build Ghostty VT on Bookworm
        run: |
          docker buildx build --platform linux/amd64 --target vt-builder --load -t ddg-ci-vt -f docker/Dockerfile .
          container=$(docker create ddg-ci-vt)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/ghostty-vt"
          docker cp "$container:/out/lib/libghostty-vt.a" "$RUNNER_TEMP/ghostty-vt/libghostty-vt.a"
      - name: Headless workspace tests, Clippy, OpenRPC and CLI versions on Bookworm
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP/ghostty-vt:/vt:ro" -w /work \
            -e GHOSTTY_VT_LIB_DIR=/vt -e CARGO_TERM_COLOR \
            rust:1-bookworm bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends clang cmake pkg-config
              rustup component add clippy
              cargo test --locked --workspace --exclude ddg-agents-native --no-fail-fast
              cargo clippy --locked --workspace --exclude ddg-agents-native --all-targets -- -D warnings
              cargo test --locked --no-fail-fast -p ddg-agents-proto openrpc_schemas_are_valid_and_up_to_date
              cargo run --locked -p ddg-agents-cli -- --version
              cargo run --locked -p ddg-agents-host -- --version
              cargo run --locked -p ddg-terminal-server -- --version
            '
