[package]
name = "ddg-agents-os"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ddg-agents-proto = { path = "../ddg-agents-proto" }
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
