[package]
name = "ddg-terminal-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ddg-terminal-server"
path = "src/main.rs"

[dependencies]
ddg-agents-os = { path = "../ddg-agents-os" }
ddg-agents-proto = { path = "../ddg-agents-proto" }
ddg-agents-vt = { path = "../ddg-agents-vt" }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

