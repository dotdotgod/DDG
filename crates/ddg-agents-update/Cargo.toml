[package]
name = "ddg-agents-update"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["network"]
network = [
    "dep:reqwest", "dep:ed25519-dalek", "dep:flate2", "dep:tar", "dep:zip",
    "dep:percent-encoding", "dep:base64", "dep:windows-sys", "dep:tempfile",
]

[dependencies]
ddg-agents-proto = { path = "../ddg-agents-proto" }
ddg-agents-os = { path = "../ddg-agents-os" }
serde.workspace = true
serde_json.workspace = true
semver = "1.0.28"
sha2 = "0.11.1"
tokio.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"], optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
flate2 = { version = "1.1.11", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }
base64 = { version = "0.22.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = { version = "3.27.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
